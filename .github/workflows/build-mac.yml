name: Build macOS package

on:
  push:
    #branches: [main]
    paths:
      - "modules/**"
      - "bombercat.py"
      - "packaging/**"
      - "*.spec"
      - "requirements.txt"
      - "VERSION"
      - ".github/workflows/build-*.yml"
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag del release al que subir el asset (ej: v1.2.0)"
        required: true
        default: "v1.2.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build .pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-latest
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION || echo latest)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sin brew install: BomberCat no tiene dependencias nativas (§4.1 del
      # plan de empaquetado) a diferencia de catnip (libusb/libmagic).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build package
        run: ./build_mac.sh "${{ steps.version.outputs.value }}"

      - name: Verify binary architecture
        run: file dist/bombercat/bombercat

      - name: Rename package
        run: mv "bombercat-${{ steps.version.outputs.value }}.pkg" "bombercat-${{ steps.version.outputs.value }}-${{ matrix.arch }}.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bombercat-macos-${{ matrix.arch }}
          path: bombercat-${{ steps.version.outputs.value }}-${{ matrix.arch }}.pkg
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: bombercat-${{ steps.version.outputs.value }}-${{ matrix.arch }}.pkg
