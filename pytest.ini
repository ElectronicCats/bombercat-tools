# Electronic Cats
# pytest configuration for the BomberCat CLI unit suite (tools/tests/test_*.py).
#
# The end-to-end scripts in tests/ are named *_hosttest.py on purpose: they are
# standalone programs (python3 tests/serialctl_hosttest.py) and pytest does not
# collect them, so both suites live side by side.
#
#   pytest                      # the whole unit suite
#   pytest -k capture           # one area
#   pytest --cov=modules        # with coverage

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
